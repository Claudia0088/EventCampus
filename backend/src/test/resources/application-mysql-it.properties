# Only loaded by the isolated integration test base. No production imports.
spring.application.name=EventCampus-MySQL-IT
spring.datasource.url=jdbc:blocked:missing-test-container
spring.datasource.driver-class-name=eventcampus.tests.NoFallbackDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.port=0
logging.level.org.springframework.security=WARN
logging.level.com.eventcampus.backend=WARN
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB