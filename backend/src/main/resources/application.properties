
spring.application.name=EventCampus

# Connexion à MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eventcampus?useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Port de l'application
server.port=8080

# Logs de sécurité
logging.level.org.springframework.security=INFO
logging.level.com.eventcampus.backend=INFO
# Sécurité des cookies de session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax